<!-- Section: Floating WhatsApp -->
<a
  class="floating-whatsapp floating-whatsapp--direct"
  href="https://api.whatsapp.com/send/?phone=554399614034&text=Ol%C3%A1%2C+gostaria+de+falar+com+a+advogada+Monique.&type=phone_number&app_absent=0"
  data-whatsapp-click="true"
  aria-label="Abra o bate-papo WhatsApp"
>
  <span class="floating-whatsapp__icon" aria-hidden="true">
    <img
      class="floating-whatsapp__avatar"
      src="/assets/images/whatsapp-agent-avatar.png"
      alt=""
      width="96"
      height="96"
      loading="lazy"
      fetchpriority="low"
      decoding="async"
    />
  </span>
</a>

<!-- Section: Nina Chat -->
<div
  class="nina-chatbot floating-whatsapp--concierge"
  data-asha-chat="true"
  data-locale="pt"
  data-whatsapp-url="https://api.whatsapp.com/send/?phone=554399614034&text=Ol%C3%A1%2C+gostaria+de+falar+com+a+advogada+Monique.&type=phone_number&app_absent=0"
  data-consult-route="/pt-br/start-consultation/"
  data-formspree-endpoint="https://formspree.io/f/xdawygld"
>
  <button
    class="nina-concierge__launcher nina-concierge__launcher--avatar"
    type="button"
    data-nina-launcher
    aria-expanded="false"
    aria-controls="nina-concierge-panel-pt"
    aria-label="Abrir bate-papo da Nina"
  >
    <img
      class="nina-concierge__launcher-image"
      src="/assets/images/chat/asha-robot-avatar.svg"
      alt=""
      width="512"
      height="512"
      loading="lazy"
      fetchpriority="low"
      decoding="async"
    />
    <span class="nina-concierge__launcher-status" aria-hidden="true"></span>
  </button>

  <section
    id="nina-concierge-panel-pt"
    class="nina-concierge__panel"
    data-nina-panel
    role="dialog"
    aria-label="Bate-papo com Nina"
    hidden
  >
    <div class="nina-concierge__shell">
      <header class="nina-concierge__header">
        <div class="nina-concierge__identity">
          <img
            class="nina-concierge__hero-image"
            src="/assets/images/chat/asha-robot-avatar.svg"
            alt="Avatar da assistente de IA Nina."
            width="512"
            height="512"
            loading="lazy"
            fetchpriority="low"
            decoding="async"
          />
          <div>
            <p class="nina-concierge__eyebrow">Assistente de IA</p>
            <h2>Nina</h2>
          </div>
        </div>
        <button class="nina-concierge__close" type="button" data-nina-close aria-label="Fechar bate-papo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z" fill="currentColor"/>
          </svg>
        </button>
      </header>

      <div class="nina-concierge__body">
        <div class="nina-concierge__transcript" data-nina-transcript></div>

        <section class="nina-concierge__prompt-shell">
          <p class="nina-concierge__prompt-label" data-nina-prompt-label></p>
          <div class="nina-concierge__options" data-nina-options></div>
        </section>

        <section class="nina-concierge__recommendations" data-nina-recommendations hidden>
          <div class="nina-concierge__recommendations-head">
            <p class="nina-concierge__eyebrow">Páginas sugeridas</p>
            <h3 data-nina-recommendation-title>Áreas de serviço prováveis</h3>
            <p data-nina-recommendation-copy></p>
          </div>
          <div class="nina-concierge__results" data-nina-results></div>
        </section>

        <section class="nina-concierge__lead-shell" data-nina-lead-shell hidden></section>
      </div>

      <footer class="nina-concierge__footer" data-nina-footer hidden>
        <a class="btn btn-cta btn-sm" href="https://api.whatsapp.com/send/?phone=554399614034&text=Ol%C3%A1%2C+gostaria+de+falar+com+a+advogada+Monique.&type=phone_number&app_absent=0" data-whatsapp-click="true" data-nina-whatsapp>Continuar no WhatsApp</a>
        <button class="btn btn-secondary btn-sm" type="button" data-nina-secondary>Deixar meus dados</button>
        <button class="nina-concierge__reset" type="button" data-nina-reset>Começar de novo</button>
      </footer>
    </div>
  </section>
</div>
