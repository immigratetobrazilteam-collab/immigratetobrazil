<!-- Section: Floating WhatsApp -->
<a
  aria-label="Abra o bate-papo WhatsApp"
  class="floating-whatsapp floating-whatsapp--direct"
  data-whatsapp-click="true"
  href="https://api.whatsapp.com/send/?phone=554399614034&amp;text=Ol%C3%A1%2C+gostaria+de+falar+com+a+advogada+Monique.&amp;type=phone_number&amp;app_absent=0"
>
  <span aria-hidden="true" class="floating-whatsapp__icon">
    <img alt="" class="floating-whatsapp__avatar" decoding="async" height="96" loading="lazy" src="/assets/images/whatsapp-agent-avatar.png" width="96" />
  </span>
</a>

<!-- Section: Nina Chat -->
<div
  class="nina-chatbot floating-whatsapp--concierge"
  data-asha-chat="true"
  data-consult-route="/pt-br/start-consultation/"
  data-formspree-endpoint="https://formspree.io/f/xdawygld"
  data-locale="pt-br"
  data-whatsapp-url="https://api.whatsapp.com/send/?phone=554399614034&amp;text=Ol%C3%A1%2C+gostaria+de+falar+com+a+advogada+Monique.&amp;type=phone_number&amp;app_absent=0"
>
  <button
    aria-controls="nina-concierge-panel-pt-br"
    aria-expanded="false"
    aria-label="Abra o bate-papo da Nina"
    class="nina-concierge__launcher nina-concierge__launcher--avatar"
    data-nina-launcher
    type="button"
  >
    <img alt="" class="nina-concierge__launcher-image" decoding="async" height="512" loading="lazy" src="/assets/images/chat/asha-robot-avatar.svg" width="512" />
    <span aria-hidden="true" class="nina-concierge__launcher-status"></span>
  </button>

  <section
    aria-label="Bate-papo com Nina"
    class="nina-concierge__panel"
    data-nina-panel
    hidden
    id="nina-concierge-panel-pt-br"
    role="dialog"
  >
    <div class="nina-concierge__shell">
      <header class="nina-concierge__header">
        <div class="nina-concierge__identity">
          <img alt="Avatar assistente de IA de Nina." class="nina-concierge__hero-image" decoding="async" height="512" loading="lazy" src="/assets/images/chat/asha-robot-avatar.svg" width="512" />
          <div>
            <p class="nina-concierge__eyebrow">Assistente de IA</p>
            <h2>Nina</h2>
          </div>
        </div>
        <button aria-label="Fechar bate-papo" class="nina-concierge__close" data-nina-close type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z" fill="currentColor"></path>
          </svg>
        </button>
      </header>

      <div class="nina-concierge__body">
        <div class="nina-concierge__transcript" data-nina-transcript></div>

        <section class="nina-concierge__prompt-shell">
          <p class="nina-concierge__prompt-label" data-nina-prompt-label></p>
          <div class="nina-concierge__options" data-nina-options></div>
        </section>

        <section class="nina-concierge__recommendations" data-nina-recommendations hidden>
          <div class="nina-concierge__recommendations-head">
            <p class="nina-concierge__eyebrow">Paginas sugeridas</p>
            <h3 data-nina-recommendation-title>Provaveis areas de servico</h3>
            <p data-nina-recommendation-copy></p>
          </div>
          <div class="nina-concierge__results" data-nina-results></div>
        </section>

        <section class="nina-concierge__lead-shell" data-nina-lead-shell hidden></section>
      </div>

      <footer class="nina-concierge__footer" data-nina-footer hidden>
        <a class="btn btn-cta btn-sm" data-nina-whatsapp data-whatsapp-click="true" href="https://api.whatsapp.com/send/?phone=554399614034&amp;text=Ol%C3%A1%2C+gostaria+de+falar+com+a+advogada+Monique.&amp;type=phone_number&amp;app_absent=0">Continuar no WhatsApp</a>
        <button class="btn btn-secondary btn-sm" data-nina-secondary type="button">Deixar meus dados</button>
        <button class="nina-concierge__reset" data-nina-reset type="button">Comecar de novo</button>
      </footer>
    </div>
  </section>
</div>
