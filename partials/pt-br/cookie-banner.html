<!-- Section: Banner de cookies -->
<div class="cookie-banner" data-cookie-banner="true" hidden>
  <div class="cookie-banner__inner" role="region" aria-label="Preferências de cookies">
    <span class="cookie-badge" aria-hidden="true">Cookies</span>

    <div class="cookie-text">
      <strong>Cookies essenciais mantêm o site seguro e funcional.</strong>
      <p>Análises opcionais ajudam a melhorar a experiência.</p>
      <a class="cookie-link" href="/pt-br/legal/cookies/" target="_blank" rel="noopener">Política</a>
    </div>

    <div class="cookie-actions">
      <button type="button" class="btn btn-secondary" data-consent="decline">Recusar</button>
      <button type="button" class="btn btn-cta" data-consent="accept">Aceitar</button>
    </div>
  </div>
</div>
