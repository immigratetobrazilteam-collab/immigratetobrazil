<!-- Seção: Inscrição na Newsletter -->
<section class="newsletter-signup" aria-labelledby="newsletter-signup-title">
  <h2 id="newsletter-signup-title">Receba atualizações</h2>
  <form action="/pt-br/" method="post" class="newsletter-form" data-newsletter-signup="true">
    <label for="newsletter-email">Email</label>
    <input id="newsletter-email" name="email" type="email" required aria-required="true" placeholder="voce@dominio.com" />
    <button type="submit" class="btn btn-primary">Inscrever</button>
  </form>
</section>
