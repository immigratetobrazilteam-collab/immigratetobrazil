<!-- Section: Comments System --><section aria-labelledby="comments-title" class="comments-system">
<h2 id="comments-title">Comentários</h2>
<div class="comments-list"></div>
<form class="comments-form" data-comments-form="true">
<label for="comment-name">Nome</label>
<input id="comment-name" required="" type="text"/>
<label for="comment-body">Comentário</label>
<textarea id="comment-body" required="" rows="4"></textarea>
<button class="btn btn-primary" type="submit">Postar comentário</button>
</form>
</section>
