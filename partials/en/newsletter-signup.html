<!-- Section: Newsletter Signup -->
<section id="newsletter-signup" class="newsletter-signup" aria-labelledby="newsletter-signup-title">
  <h2 id="newsletter-signup-title">Get Brazilian immigration updates</h2>
  <form action="/" method="post" class="newsletter-form" data-newsletter-signup="true">
    <label for="newsletter-email">Email</label>
    <input id="newsletter-email" name="email" type="email" required aria-required="true" placeholder="you@domain.com" />
    <button type="submit" class="btn btn-primary">Subscribe</button>
  </form>
</section>
