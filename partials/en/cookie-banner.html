<!-- Section: Cookie Banner -->
<div class="cookie-banner" data-cookie-banner="true" hidden>
  <div class="cookie-banner__inner">
    
    <div class="cookie-text">
      <strong>Cookie settings</strong>
      <p>
        Essential site settings support accessibility, search, and session preferences. 
        Analytics load only after consent is granted.
      </p>

      <!-- Small policy link -->
      <p class="cookie-policy-text">
        <a href="https://immigratetobrazil.com/legal/cookies/" target="_blank" rel="noopener">
          Read Cookie Policy
        </a>
      </p>
    </div>

    <div class="cookie-actions">
      <button type="button" class="btn btn-secondary" data-consent="decline">
        Decline
      </button>

      <button type="button" class="btn btn-cta" data-consent="accept">
        Accept
      </button>
    </div>

  </div>
</div>
