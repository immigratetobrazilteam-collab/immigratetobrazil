<!-- Section: Cookie Banner -->
<div class="cookie-banner" data-cookie-banner="true" hidden>
  <div class="cookie-banner__inner">
    <div class="cookie-logo">
      <img src="/assets/logo/logo.png" alt="Immigrate to Brazil" />
    </div>

    <div class="cookie-text">
      <strong>Cookie preferences</strong>
      <p>We use essential cookies to keep this Brazil immigration website secure, accessible, and fully functional. Optional analytics help us improve guidance and client experience.</p>
      <a class="cookie-link" href="/legal/cookies/" target="_blank" rel="noopener">View cookie policy</a>
    </div>

    <div class="cookie-actions">
      <button type="button" class="btn btn-secondary" data-consent="decline">Decline analytics</button>
      <button type="button" class="btn btn-cta" data-consent="accept">Accept analytics</button>
    </div>
  </div>
</div>
