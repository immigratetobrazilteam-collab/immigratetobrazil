<!-- Section: Cookie Banner -->
<div class="cookie-banner" data-cookie-banner="true" hidden>
  <div class="cookie-banner__inner" role="region" aria-label="Cookie preferences">
    <span class="cookie-badge" aria-hidden="true">Cookies</span>

    <div class="cookie-text">
      <strong>Essential cookies keep the site running.</strong>
      <p>Analytics cookies are optional. We still use limited cookieless measurement to understand site performance.</p>
      <a class="cookie-link" href="/legal/cookies/" target="_blank" rel="noopener">Policy</a>
    </div>

    <div class="cookie-actions">
      <button type="button" class="btn btn-secondary" data-consent="decline">Reject</button>
      <button type="button" class="btn btn-cta" data-consent="accept">Accept</button>
    </div>
  </div>
</div>
