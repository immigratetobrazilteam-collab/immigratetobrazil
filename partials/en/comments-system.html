<!-- Section: Comments System -->
<section class="comments-system" aria-labelledby="comments-title">
  <h2 id="comments-title">Comments</h2>
  <div class="comments-list"></div>
  <form class="comments-form" data-comments-form="true">
    <label for="comment-name">Name</label>
    <input id="comment-name" type="text" required />
    <label for="comment-body">Comment</label>
    <textarea id="comment-body" rows="4" required></textarea>
    <button type="submit" class="btn btn-primary">Post comment</button>
  </form>
</section>
