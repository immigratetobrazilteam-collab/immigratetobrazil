<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Asha robot avatar</title>
  <desc id="desc">A feminine robot guide with long wavy copper-red hair, green eyes, and warm metallic facial details.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10261d" />
      <stop offset="50%" stop-color="#18362b" />
      <stop offset="100%" stop-color="#5b2c22" />
    </linearGradient>
    <linearGradient id="halo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d9b2" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#cf7b46" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbc84" />
      <stop offset="18%" stop-color="#ef7e4d" />
      <stop offset="52%" stop-color="#b5382a" />
      <stop offset="100%" stop-color="#5e1d1c" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbe8da" />
      <stop offset="100%" stop-color="#e6baa2" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d8d2" />
      <stop offset="100%" stop-color="#6f8e86" />
    </linearGradient>
    <linearGradient id="chassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a4031" />
      <stop offset="100%" stop-color="#0b1d17" />
    </linearGradient>
    <radialGradient id="visor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d7fff0" />
      <stop offset="60%" stop-color="#74c69d" />
      <stop offset="100%" stop-color="#1f7b60" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

